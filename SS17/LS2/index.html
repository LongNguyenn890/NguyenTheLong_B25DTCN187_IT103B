<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="todo-box">
            <div class="header">
                <h1>Công việc chuẩn bị Tết</h1>
                <p>Click để đánh dấu hoàn thành</p>
            </div>
            <div class="add-box">
                <input type="text" placeholder="Nhập công việc mới" class = "search-input" id = "add-input">
                <button class = "add-btn" id = "add-btn">Thêm</button>
            </div>
            <div class="todo-container">
                <ul class="todo-list" id = "todo-list"></ul>
                <div class="footer">
                    <p>Trạng thai được lưu tự động vao localStorage . Refresh để kiểm tra</p>
                </div>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
