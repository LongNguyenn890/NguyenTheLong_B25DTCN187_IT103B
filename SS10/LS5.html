<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const teamHistory = [
            {
                name: "Messi",
                position: "Forward",
                nationality: "Argentina",
                seasons: {
                    "2022-2023": { matches: 34, goals: 21, assists: 14, yellowCards: 3 },
                    "2023-2024": { matches: 32, goals: 25, assists: 15, yellowCards: 2 },
                    "2024-2025": { matches: 28, goals: 18, assists: 12, yellowCards: 1 },
                },
            },
            {
                name: "Ronaldo",
                position: "Forward",
                nationality: "Portugal",
                seasons: {
                    "2022-2023": { matches: 38, goals: 28, assists: 8, yellowCards: 5 },
                    "2023-2024": { matches: 35, goals: 30, assists: 10, yellowCards: 4 },
                    "2024-2025": { matches: 30, goals: 22, assists: 9, yellowCards: 3 },
                },
            },
        ];

        function generatePlayerSeasonReport(playerName, teamHistory) {
            let findPlayer = teamHistory.find(player => player.name == playerName);
            if (!findPlayer) {
                return "Không tìm thấy cầu thủ";
            }
            let seasons = Object.entries(findPlayer.seasons);

            let totalMatches = 0;
            let totalGoals = 0;
            let totalAssists = 0;
            let totalYellowCards = 0;

            let bestSeason = null;
            let bestSeasonName = "";

            seasons.forEach(([seasonName, stats]) => {
                totalMatches += stats.matches;
                totalGoals += stats.goals;
                totalAssists += stats.assists;
                totalYellowCards += stats.yellowCards;

                if (!bestSeason || stats.goals > bestSeason.goals || (stats.goals === bestSeason.goals && stats.assists > bestSeason.assists)) {
                    bestSeason = stats;
                    bestSeasonName = seasonName;
                }
            });

            const averageGoalsPerMatch = (totalGoals / totalMatches).toFixed(2);
            const averageAssistsPerMatch = (totalAssists / totalMatches).toFixed(2);
            return {
                name: findPlayer.name,
                position: findPlayer.position,
                nationality: findPlayer.nationality,
                careerStats: {
                    totalMatches,
                    totalGoals,
                    totalAssists,
                    totalYellowCards,
                    averageGoalsPerMatch: Number(averageGoalsPerMatch),
                    averageAssistsPerMatch: Number(averageAssistsPerMatch),
                    bestSeason: {
                        season: bestSeasonName,
                        goals: bestSeason.goals,
                        assists: bestSeason.assists
                    }
                }
            };
        }

        console.log(generatePlayerSeasonReport("Messi", teamHistory));

    </script>
</body>

</html>
