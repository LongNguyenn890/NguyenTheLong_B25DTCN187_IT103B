<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS3</title>
</head>

<body>
    <h1>Lesson 3</h1>
    <script>
        const players = [
            { name: "Messi", position: "Forward", age: 36, goals: 25, assists: 15, matches: 34 },
            { name: "Ronaldo", position: "Forward", age: 39, goals: 30, assists: 10, matches: 38 },
            { name: "Neymar", position: "Forward", age: 32, goals: 18, assists: 20, matches: 32 },
            { name: "De Bruyne", position: "Midfielder", age: 33, goals: 8, assists: 25, matches: 35 },
            { name: "Kante", position: "Midfielder", age: 33, goals: 2, assists: 5, matches: 36 },
            { name: "Van Dijk", position: "Defender", age: 33, goals: 5, assists: 3, matches: 33 },
            { name: "Alisson", position: "Goalkeeper", age: 31, goals: 0, assists: 1, matches: 37 }
        ];

        function getFilterdTotalGoals(minGoals, teamPlayers) {
            let totalGoal = teamPlayers.filter(player => player.goals >= minGoals).reduce((total, player) => {return total + player.goals}, 0); 
            return totalGoal;
        }

        console.log(`Tổng số bàn thắng của các cầu thủ đạt đủ chỉ tiêu là: ${getFilterdTotalGoals(5,players)}`);
        console.log(`Tổng số bàn thắng của các cầu thủ đạt đủ chỉ tiêu là: ${getFilterdTotalGoals(50,players)}`);
    </script>
</body>

</html>
