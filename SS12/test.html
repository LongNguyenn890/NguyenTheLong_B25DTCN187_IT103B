<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function filterAndSort() {
            let instockList = products.filter(p  => p.inStock === true)
            let sortList = instockList.sort((a,b) => b.price - a.price);
            return sortList;
        }

        function displayByCondition() {
            let accessories = products.filter(p => p.category === "Phụ kiện").map((p) => `${p.name}`);
            console.log(accessories);
        }

        function totalPrice() {
            let inStockList = filterAndSort();
            let total = inStockList.reduce((total, p) => total + p.price,0);
            return total;
        }
        let products = [
            { id: "P01", name: "Laptop Macbook Pro M3", price: 2000, category: "Laptop", inStock: true },
            { id: "P02", name: "Chuột Không Dây Logitech", price: 45, category: "Phụ kiện", inStock: true },
            { id: "P03", name: "Bàn phím cơ Keychron", price: 95, category: "Phụ kiện", inStock: false },
            { id: "P04", name: "Màn hình Dell UltraSharp", price: 450, category: "Màn hình", inStock: true },
            { id: "P05", name: "Tai nghe Sony WH-100XM5", price: 350, category: "Phụ kiện", inStock: true },
        ];

        console.log(filterAndSort());
        displayByCondition();
        console.log("Tổng giá trị các mặt hàng trong kho là: ", totalPrice());
    </script>
</body>

</html>
