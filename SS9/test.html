<body>
    <script>
        let orders = ["Đơn hàng A", "Đơn hàng B", "Đơn hàng C", "Đơn hàng D", "Đơn hàng E"];
        let revenues = [1500, 2800, 1200, -500, 3200];
        let orderReports = orders.map((order, index) => {console.log( `Đơn hàng ${order} mang về ${revenues[index]} USD`);});
        let totalValue = revenues.filter(revenue => revenue > 0).reduce((total, revenue) => {return total + revenue}, 0);
        console.log(`Tổng doanh thu hợp lệ: ${totalValue} USD`);
    </script>
</body>
