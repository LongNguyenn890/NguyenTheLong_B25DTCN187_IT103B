<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function searchProduct(products,id) {
            let findProduct = products.find(product => product.id === id);
            if (findProduct) {
                console.log(findProduct);
            } else {
                console.log("Không tìm thấy sản phẩm");
            }
        }

        function checkIntegrity(products) {
            let check = products.every(product => product.price > 0);
            if(check) {
                console.log("Dữ liệu bảng giá hợp lệ");
            } else {
                console.log("Phát hiện sản phẩm chưa cập nhật giá");
            }
        }

        function formatDisplay(product) {
            let catalogDisplay = products.map((product) => {
                console.log(`${product.name} - Giá: $${product.price} - Trạng thái: ${product.inStock? "Còn hàng": "Hết hàng"}`);
            });
        }
    
        let products = [
            { id: "P01", name: "Laptop Macbook Pro M3", price: 2000, category: "Laptop", inStock: true },
            { id: "P02", name: "Chuột Không Dây Logitech", price: 45, category: "Phụ kiện", inStock: true },
            { id: "P03", name: "Bàn phím cơ Keychron", price: 95, category: "Phụ kiện", inStock: false },
            { id: "P04", name: "Màn hình Dell UltraSharp", price: 450, category: "Màn hình", inStock: true },
            { id: "P05", name: "Tai nghe Sony WH-100XM5", price: 350, category: "Phụ kiện", inStock: true },
        ];

        searchProduct(products,"P03");
        checkIntegrity(products);
        formatDisplay(products);
        
    </script>
</body>

</html>
