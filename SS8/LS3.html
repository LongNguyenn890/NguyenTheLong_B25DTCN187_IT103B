    <script>
        function filterPlayersByPositon (position, players) {
            let result = [];
            let filterPlayer = players.map((player) => {
                let parts = player.split(" - ");
                if (parts[1] == position) {
                    result.push(`${parts[0]} - ${parts[1]}`);
                }
            });
            return result;
        }
        const players = [
            "Messi - Forward",
            "Ronaldo - Forward",

        ];
        console.log(filterPlayersByPositon("Forward",players));
