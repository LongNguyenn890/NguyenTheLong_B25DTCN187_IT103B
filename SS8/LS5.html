<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function reportTopPerformers(minPerformance, players) {
            let filterPlayers = players.map(player => {
                let parts = player.split(" - ");
                let name = parts[0];
                let goal = Number(parts[2]);
                let assit = Number(parts[3]);
                let goalPerformance = goal + assit;
                return [name, goalPerformance];
            }).filter(player => player[1] >= minPerformance);

            let arr = filterPlayers.map(player => `${player[0]}: ${player[1]}`);
            arr.forEach(element => {
                console.log(element);
            });

            let totalPerformance = filterPlayers.reduce((total, player) => total + player[1], 0);
            console.log("Tổng hiệu suất: ", totalPerformance);
        }

        const players = [
            "Messi - Forward - 25 - 15",
            "Ronaldo - Forward - 30 - 10",
            "Neymar - Forward - 18 - 20",
            "De Bruyne - Midfielder - 8 - 25",
            "Kante - Midfielder - 2 - 5",
            "Van Dijk - Defender - 5 - 3",
            "Alisson - Goalkeeper - 0 - 1",
        ];
        reportTopPerformers(50, players);
    </script>
</body>

</html>
