    <script>
        function getReversedNames(players) {
            let arr = [];
            let arrReverse = players.map(player => {
                let parts = player.split(" - ");
                arr.push(`${parts[0]}`);
            });
            return arr.reverse();
        }
        const players = [
            "Messi - Forward - 25",
            "Ronaldo - Forward - 30",

            "De Bruyne - Midfielder - 8",
            "Kante - Midfielder - 2",

        ];
